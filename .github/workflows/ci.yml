name: CI
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    if: ${{ !contains(github.event.pull_request.title, 'job-off') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          mode=$(cat mode.txt 2>/dev/null || echo green)
          echo "mode=$mode"
          case "$mode" in
            green) exit 0 ;;
            red) exit 1 ;;
            slow) sleep 240 ;;
            *) exit 1 ;;
          esac
