name: Names
on:
  pull_request:
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  matrix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - run: "true"
  named:
    name: Named (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - run: "true"
